# Il piano Free di Supabase mette in pausa il progetto dopo 7 giorni senza attività:
# due richieste a settimana lo tengono sveglio. Le RLS restituiscono una lista vuota,
# ma la query arriva comunque al database.
name: Supabase sveglio

on:
  schedule:
    - cron: '17 6 * * 1,4' # lunedì e giovedì, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Richiesta al database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            "$SUPABASE_URL/rest/v1/campaigns?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
